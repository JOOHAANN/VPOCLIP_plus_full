# Full 50/5 training with the original eight-prompt text ensemble.
# Checkpoint score is validation accuracy minus all-sample normalized entropy.
base_config: ./config_final_aug.yaml

runtime:
  device: cuda:1

data:
  text:
    cache_output: ./work_dir/final_aug_entropy_h5_full300_score/clip_text_action_embeddings.pt

train:
  init_checkpoint: null
  epochs: 300
  swa_start: null
  checkpoint_every: 10
  model_selection: val_accuracy_minus_entropy
  loss:
    mode: cross_entropy_entropy
    entropy_weight: 5.0
    entropy_temperature: 0.1
    entropy_scope: all
    entropy_normalize: true
    entropy_correct_only: true
    entropy_start_epoch: 10
    entropy_warmup_epochs: 20
    scale_independent: true
    anchor_weight: 0.0
    anchor_scope: visual

outputs:
  work_dir: ./work_dir/final_aug_entropy_h5_full300_score
  run_name: final50_h5_8prompt_300_acc_minus_h
