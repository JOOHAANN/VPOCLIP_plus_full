# CLIPGCN tri-modal contrastive training config for 35 seen / 20 unseen classes.
# Relative paths are resolved from this config file's directory.

runtime:
  device: cuda:0
  seed: 20260616
  amp: true
  no_show: true

data:
  train:
    data_dir: ./data/contrastive_zsl_splits/35_20
    prefix: seen
    mmap: true

  val:
    data_dir: null
    prefix: seen
    mmap: true

  validation_split:
    fraction: 0.1
    seed: 20260616

  text:
    xlsx: ./ntu55_global_descriptions.xlsx
    id_column: ID
    text_column: global_description
    label_offset: 1
    prompt_template: "{global_description}"
    batch_size: 128
    cache_output: ./work_dir/clip_text_action_embeddings.pt

  dataloader:
    batch_size: 128
    num_workers: 16
    train_shuffle: true
    val_shuffle: false
    pin_memory: true
    drop_last: true

model:
  text_encoder:
    name: ViT-B/32
    download_root: null
  fusion:
    # reducer: attention_pool  spatial GAP + temporal attention  (~1.5M)
    #          gap             spatial GAP + temporal GAP        (~0.7M, ablation)
    #          flatten_fc      original 25200->512 projection    (~13M, ablation)
    reducer: attention_pool
    dropout: 0.4
    attention_dim: 256
    attention_heads: 4
    attention_layers: 1
    # object_fusion: cross_attention  objects are key/value, frames are query
    #                broadcast        object map repeated on every frame
    #                temporal_concat  original: object map as a 14th frame
    object_fusion: cross_attention
    object_attention_dim: 128
    object_attention_heads: 4
    object_dropout: 0.1

train:
  epochs: 240
  val_interval: 1
  grad_clip_norm: 1.0
  optimizer:
    name: AdamW
    lr: 0.0001
    weight_decay: 0.0001

outputs:
  work_dir: ./work_dir/clipgcn_contrastive_35_20
  auto_run_dir: true
  run_name: null
  best_model: ./work_dir/clipgcn_contrastive_35_20/best_model.pth
  last_model: ./work_dir/clipgcn_contrastive_35_20/last_model.pth
  history: ./work_dir/clipgcn_contrastive_35_20/history.json
  train_curve: ./work_dir/clipgcn_contrastive_35_20/train_curve.png
  test_results: ./work_dir/clipgcn_contrastive_35_20/unseen_test_results.json

inference:
  gating:
    enabled: true
    # YOLO sees no person -> unknown, whatever the scores say.
    require_person: true
    person_slot: 0            # class 0 of the custom50 detector is "person"
    novelty:
      method: entropy         # entropy | prototype
      temperature: 0.1        # softmax temperature the entropy is measured at
      entropy_threshold: 0.55 # above this the window is too ambiguous -> unknown
      cosine_threshold: 0.25  # below this no prototype is close enough -> unknown
    motion:
      enabled: true
      static_threshold: 0.004 # mean per-joint displacement per frame
      static_labels: [52]     # a motionless person is unknown or "fallen on the floor"
      static_cosine_threshold: 0.25
    hysteresis: 3             # agreeing windows needed before the label switches
