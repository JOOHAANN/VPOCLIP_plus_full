# SC-NBV v24: explicit causal current-view semantic scores.
#
# The current-view VPOCLIP logits are available before selecting a move.  They
# are not future-view features and do not contain the ground-truth label.  The
# candidate side remains v23's sample-specific g22 geometry; no camera-ID
# direction assumption and no RL/random gate are used.
