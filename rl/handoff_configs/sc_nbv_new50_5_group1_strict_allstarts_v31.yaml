# v31: strict class-held-out training with recording-specific view geometry.
#
# The ten pseudo-unseen classes are absent from the policy-training pool.  All
# valid current views are used for training, while the primary evaluation
# protocol remains fixed view 0.  Candidate rows are physical camera records;
# g25 recomputes each recording's angular rank and never treats camera IDs as
# universal left/right labels.  v1-v30 remain untouched.
runtime:
  device: cuda:0
  seeds: [20260909, 20260910, 20260911]
  num_threads: 8
  matmul_precision: high

raw_cache: /home/youhan/ws/VPOCLIP_plus_full/data/rl_raw_new50_5_group1_stage_b/cache
sc_cache: /home/youhan/ws/VPOCLIP_plus_full/data/sc_nbv_new50_5_group1_strict_allstarts_v31/cache
