      direct_sensor_fusion: true
      skeleton_encoder: temporal
      skeleton_mode: canonical
      sensor_width: 16
      semantic_dropout: 0.15
      sensor_features: [z, semantic, object, bank_current_top5, evidence, quality, uncertainty]
      sensor_interaction: per_modality
      interaction_scale: 0.08
      geometry_spread_prior: 0.00
      candidate_encoding: g25
      include_absolute_direction: false
      normalize_z: true
      normalize_semantic: true
      prototype_prior: false
      transition_policy: false
      auxiliary_transition: false
      dynamic_task_banks: true
      resample_task_banks: true
      task_bank_size: 5
      task_full_fraction: 0.0
      utility_mode: delta_margin
      centered_targets: true
      class_balanced: true
