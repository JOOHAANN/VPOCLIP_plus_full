# SC-NBV v25: strict class-held-out selector training.
#
# v24 is preserved, but its 50-class training pool overlapped the ten
# pseudo-unseen validation classes.  v25 uses a clean 40/10 proxy split for
# model selection.  The true five unseen classes remain untouched until final
# evaluation.  Candidate actions stay raw camera slots for lookup only; g22
# uses sample-specific body-relative geometry, with no camera-ID direction
# assumption and no RL/random gate.
