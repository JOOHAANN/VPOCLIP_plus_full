# Confidence-aware single-prompt adaptation from Stage A best_model.pth.
base_config: /home/youhan/ws/VPOCLIP_plus_full/config_final_aug_entropy_single_h2.yaml

runtime:
  device: cuda:0
  seed: 20260616
  amp: true
  no_show: true

data:
  train:
    data_dir: /home/youhan/ws/VPOCLIP_plus_full/data/allviews_cs45_lowview50_5_zsl
    prefix: trimodal_train
    pose_suffix: _coco17
    mmap: true
  val:
    data_dir: /home/youhan/ws/VPOCLIP_plus_full/data/allviews_cs45_lowview50_5_zsl
    prefix: trimodal_val
    pose_suffix: _coco17
    mmap: true
  text:
    xlsx: /home/youhan/ws/VPOCLIP_plus_full/ntu55_global_descriptions.xlsx
    id_column: ID
    text_column: global_description
    label_offset: 1
    prompt_template: "{global_description}"
    prompt_templates: null
    cache_output: /home/youhan/ws/VPOCLIP_plus_full/work_dir/allviews_lowview50_5_recipe_stage_b/text.pt
  dataloader:
    batch_size: 128
    num_workers: 16
    persistent_workers: true
    train_shuffle: true
    val_shuffle: false
    class_balanced_sampling: true
    pin_memory: true
    drop_last: true

train:
  init_checkpoint: /home/youhan/ws/VPOCLIP_plus_full/work_dir/allviews_lowview50_5_recipe_stage_a/best_model.pth
  epochs: 20
  loss:
    mode: cross_entropy_entropy
    entropy_weight: 2.0
    entropy_temperature: 0.1
    entropy_scope: all
    entropy_normalize: true
    entropy_correct_only: true
    entropy_start_epoch: 0
    entropy_warmup_epochs: 5
    scale_independent: true
    anchor_weight: 100.0
    anchor_scope: visual
  freeze_batchnorm: true
  swa_start: null
  val_interval: 1
  grad_clip_norm: 1.0
  scheduler: cosine
  min_lr: 1.0e-6
  model_selection: val_accuracy
  optimizer:
    name: AdamW
    lr: 2.0e-6
    weight_decay: 0.0

outputs:
  work_dir: /home/youhan/ws/VPOCLIP_plus_full/work_dir/allviews_lowview50_5_recipe_stage_b
  auto_run_dir: false
  best_model: /home/youhan/ws/VPOCLIP_plus_full/work_dir/allviews_lowview50_5_recipe_stage_b/best_model.pth
  last_model: /home/youhan/ws/VPOCLIP_plus_full/work_dir/allviews_lowview50_5_recipe_stage_b/last_model.pth
  history: /home/youhan/ws/VPOCLIP_plus_full/work_dir/allviews_lowview50_5_recipe_stage_b/history.json
  train_curve: /home/youhan/ws/VPOCLIP_plus_full/work_dir/allviews_lowview50_5_recipe_stage_b/train_curve.png
  test_results: /home/youhan/ws/VPOCLIP_plus_full/work_dir/allviews_lowview50_5_recipe_stage_b/unseen_test_results.json
