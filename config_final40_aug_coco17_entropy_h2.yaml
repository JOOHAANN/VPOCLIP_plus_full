# Lambda-H=2 adaptation matching the best final_aug 50/5 operating point.
base_config: ./config_final_aug_entropy_single_h2.yaml

runtime:
  device: cuda:0

data:
  train:
    data_dir: ./data/contrastive_cs_70_10_20_zsl_40_15_coco17_current
    prefix: trimodal_train
    pose_suffix: _coco17
    mmap: true
  val:
    data_dir: ./data/contrastive_cs_70_10_20_zsl_40_15_coco17_current
    prefix: trimodal_val
    pose_suffix: _coco17
    mmap: true
  text:
    cache_output: ./work_dir/final40_aug_coco17_entropy_h2/clip_text_action_embeddings.pt

train:
  init_checkpoint: ./work_dir/final40_aug_coco17/ce_8prompt_full300/best_model.pth

outputs:
  work_dir: ./work_dir/final40_aug_coco17_entropy_h2
  run_name: lambdaH2_anchor100
