# Group1 pseudo-unseen probe (stage B), independent hold-out group.
base_config: /home/youhan/ws/VPOCLIP_plus_full/config_final_aug_entropy_single_h2.yaml

runtime:
  device: cuda:0
  seed: 20260913
  amp: true
  no_show: true
  cudnn_benchmark: true
  allow_tf32: true
  matmul_precision: high

data:
  train:
    data_dir: /home/youhan/ws/VPOCLIP_plus_full/data/new50_5_group1_zsl
    prefix: trimodal_train
    pose_suffix: _coco17
    mmap: true
    pseudo_unseen: [3, 13, 30, 41, 52]
  val:
    data_dir: /home/youhan/ws/VPOCLIP_plus_full/data/new50_5_group1_zsl
    prefix: trimodal_val
    pose_suffix: _coco17
    mmap: true
  pseudo_val:
    classes: [3, 13, 30, 41, 52]
    sources:
      - data_dir: /home/youhan/ws/VPOCLIP_plus_full/data/new50_5_group1_zsl
        prefix: trimodal_train
        pose_suffix: _coco17
      - data_dir: /home/youhan/ws/VPOCLIP_plus_full/data/new50_5_group1_zsl
        prefix: trimodal_val
        pose_suffix: _coco17
  dataloader:
    batch_size: 2048
    num_workers: 16
    persistent_workers: true
    prefetch_factor: 4
    train_shuffle: true
    val_shuffle: false
    class_balanced_sampling: true
    pin_memory: true
    drop_last: true

train:
  epochs: 20
  model_selection: pseudo_zsl
  checkpoint_every: 0
  save_every: 1
  swa_start: null
  freeze_batchnorm: true
  val_interval: 1
  grad_clip_norm: 1.0
  scheduler: cosine
  min_lr: 1.0e-6
  optimizer:
    name: AdamW
    lr: 2.0e-6
    weight_decay: 0.0
  loss:
    mode: cross_entropy_entropy
    entropy_weight: 2.0
    entropy_temperature: 0.1
    entropy_scope: all
    entropy_normalize: true
    entropy_correct_only: true
    entropy_start_epoch: 0
    entropy_warmup_epochs: 5
    scale_independent: true
    anchor_weight: 100.0
    anchor_scope: visual
  init_checkpoint: /home/youhan/ws/VPOCLIP_plus_full/work_dir/g1_pseudo_p4_stage_a/best_model.pth

outputs:
  work_dir: /home/youhan/ws/VPOCLIP_plus_full/work_dir/g1_pseudo_p4_stage_b
  auto_run_dir: false
  run_name: null
  best_model: /home/youhan/ws/VPOCLIP_plus_full/work_dir/g1_pseudo_p4_stage_b/best_model.pth
  last_model: /home/youhan/ws/VPOCLIP_plus_full/work_dir/g1_pseudo_p4_stage_b/last_model.pth
  history: /home/youhan/ws/VPOCLIP_plus_full/work_dir/g1_pseudo_p4_stage_b/history.json
  train_curve: /home/youhan/ws/VPOCLIP_plus_full/work_dir/g1_pseudo_p4_stage_b/train_curve.png
  test_results: /home/youhan/ws/VPOCLIP_plus_full/work_dir/g1_pseudo_p4_stage_b/pseudo_results.json
