  A040: off   # label=39 | rubbing face with hands
  A041: off   # label=40 | doing freehand exercise
  A042: off   # label=41 | doing neck roll exercise
  A043: off   # label=42 | massaging a shoulder oneself
  A044: off   # label=43 | taking a bow
  A045: off   # label=44 | talking to each other
