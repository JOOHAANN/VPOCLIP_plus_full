# Final group1 all-view model.  The epoch count is supplied by the pseudo-
# unseen selector via `train.py --epochs`; no real unseen clip is used to pick
# that number.
base_config: /home/youhan/ws/VPOCLIP_plus_full/config_final_aug.yaml

runtime:
  device: cuda:0
  seed: 20260914
  amp: true
  no_show: true
  cudnn_benchmark: true
  allow_tf32: true
  matmul_precision: high

data:
  train:
    data_dir: /home/youhan/ws/VPOCLIP_plus_full/data/new50_5_group1_zsl
    prefix: trimodal_train
    pose_suffix: _coco17
    mmap: true
  val:
    data_dir: /home/youhan/ws/VPOCLIP_plus_full/data/new50_5_group1_zsl
    prefix: trimodal_val
    pose_suffix: _coco17
    mmap: true
  dataloader:
    batch_size: 2048
    num_workers: 16
    persistent_workers: true
    prefetch_factor: 4
    train_shuffle: true
    val_shuffle: false
    class_balanced_sampling: true
    pin_memory: true
    drop_last: true

train:
  epochs: 300
  val_interval: 1
  model_selection: val_accuracy
  checkpoint_every: 0
  save_every: 1
  swa_start: null
  scheduler: cosine
  min_lr: 1.0e-6
  grad_clip_norm: 1.0
  optimizer:
    name: AdamW
    lr: 1.0e-4
    weight_decay: 1.0e-4

outputs:
  work_dir: /home/youhan/ws/VPOCLIP_plus_full/work_dir/g1_pseudo_selected_stage_a
  auto_run_dir: false
  run_name: null
  best_model: /home/youhan/ws/VPOCLIP_plus_full/work_dir/g1_pseudo_selected_stage_a/best_model.pth
  last_model: /home/youhan/ws/VPOCLIP_plus_full/work_dir/g1_pseudo_selected_stage_a/last_model.pth
  history: /home/youhan/ws/VPOCLIP_plus_full/work_dir/g1_pseudo_selected_stage_a/history.json
  train_curve: /home/youhan/ws/VPOCLIP_plus_full/work_dir/g1_pseudo_selected_stage_a/train_curve.png
  test_results: /home/youhan/ws/VPOCLIP_plus_full/work_dir/g1_pseudo_selected_stage_a/unseen_test_results.json
