# Higher-entropy-weight trade-off run from the actual final_aug best checkpoint.
base_config: ./config_final_aug_entropy_anchor_best10.yaml

runtime:
  device: cuda:1

data:
  text:
    cache_output: ./work_dir/final_aug_entropy_tradeoff_h002/clip_text_action_embeddings.pt

train:
  epochs: 20
  loss:
    entropy_weight: 0.02
    entropy_scope: all
    entropy_warmup_epochs: 5
    anchor_weight: 10.0

outputs:
  work_dir: ./work_dir/final_aug_entropy_tradeoff_h002
  run_name: final_best_lambdaH0p02_anchor10
